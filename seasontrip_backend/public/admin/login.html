<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SeasonTrip 管理员登录</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#edf4ef,#f6efe4);font-family:Arial,"Microsoft YaHei",sans-serif;color:#18211d}
    .card{width:min(420px,calc(100% - 36px));background:#fffdf8;border:1px solid #e1e5de;border-radius:28px;padding:34px;box-shadow:0 25px 70px rgba(20,40,33,.12)}
    .brand{font-weight:800;font-size:22px}.sub{color:#6c746f;font-size:13px;margin-top:6px;margin-bottom:28px}
    label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:13px 14px;border:1px solid #dfe3dc;border-radius:13px;outline:none}
    button{width:100%;margin-top:20px;border:0;padding:13px;border-radius:14px;background:#214c40;color:#fff;font-weight:800;cursor:pointer}
    .error{color:#b34f3d;font-size:13px;margin-top:14px;min-height:20px}.hint{margin-top:16px;color:#7a837d;font-size:12px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">SeasonTrip · Admin</div>
    <div class="sub">旅游资讯网站后台管理系统</div>
    <form id="loginForm">
      <label>管理员账号</label>
      <input id="username" value="an" autocomplete="username" required>
      <label>密码</label>
      <input id="password" value="1234" type="password" autocomplete="current-password" required>
      <button type="submit">登录后台</button>
      <div class="error" id="error"></div>
    </form>
    <div class="hint">开发环境默认账户：an / 1234。正式部署前请务必修改密码。</div>
  </main>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const error = document.getElementById('error');
  error.textContent = '';
  const res = await fetch('/api/auth/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    credentials:'include',
    body:JSON.stringify({
      username:document.getElementById('username').value,
      password:document.getElementById('password').value
    })
  });
  const data = await res.json();
  if(!res.ok){ error.textContent = data.message || '登录失败'; return; }
  location.href='/admin/index.html';
});
</script>
</body>
</html>
